[package]
name = "runtime-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["signal", "process", "sched", "fs", "mount"] }
libc = "0.2"
cgroups-rs = "0.3"
seccompiler = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
