name: CI

on:
  pull_request:
    branches: [main, AION, capo, CAPO, capo-structure]
  push:
    branches: [main, AION, capo, CAPO, capo-structure]

permissions:
  contents: read

jobs:
  architecture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test deps
        run: python -m pip install --require-hashes --requirement control/requirements.validation.lock
      - name: Enforce canonical ownership and migration gate
        run: python -m pytest tests/architecture -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install python deps
        run: python -m pip install --require-hashes --requirement control/requirements.validation.lock
      - name: Python lint
        run: ruff check .
      - name: Rust lint
        run: cargo clippy --manifest-path runtime-daemon/Cargo.toml --all-targets -- -D warnings
      - name: Conventional commits (PR title)
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.title }}" | grep -E '^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert)(\(.+\))?!?: .+'

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test deps
        run: python -m pip install --require-hashes --requirement control/requirements.validation.lock
      - name: Unit and architecture tests
        run: pytest -q tests/
      - name: Rust tests
        run: cargo test --locked --manifest-path runtime-daemon/Cargo.toml --all-targets
      - name: Rust release build
        run: cargo build --locked --release --manifest-path runtime-daemon/Cargo.toml
      - name: Record Runtime artifact checksum
        run: sha256sum runtime-daemon/target/release/runtime-daemon > runtime-daemon.sha256
      - name: Upload locked Runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-daemon-${{ github.sha }}-linux-amd64
          path: |
            runtime-daemon/target/release/runtime-daemon
            runtime-daemon.sha256
          if-no-files-found: error

  service-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: |
            gateway/package-lock.json
            integrations/windows-agentic-bridge/bridge-server/package-lock.json
            integrations/windows-agentic-bridge/bridge-ui/package-lock.json
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
      - name: Gateway build and tests
        run: |
          npm ci --prefix gateway
          npm run build --prefix gateway
          npm test --prefix gateway
      - name: Console build and tests
        run: |
          pnpm --dir console install --frozen-lockfile
          pnpm --dir console prisma:generate
          pnpm --dir console test --config vitest.config.mts
          pnpm --dir console build
      - name: Windows Bridge build and tests
        run: |
          npm ci --prefix integrations/windows-agentic-bridge/bridge-server
          npm run build --prefix integrations/windows-agentic-bridge/bridge-server
          npm test --prefix integrations/windows-agentic-bridge/bridge-server -- --run
          npm ci --prefix integrations/windows-agentic-bridge/bridge-ui
          npm run build --prefix integrations/windows-agentic-bridge/bridge-ui

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install integration dependencies
        run: python -m pip install --require-hashes --requirement control/requirements.validation.lock
      - name: Integration test placeholder
        run: |
          if [ -d tests/integration ]; then
            pytest -q tests/integration
          else
            echo "No integration tests yet"
          fi

  security:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Bandit
        run: |
          python -m pip install --require-hashes --requirement control/requirements.validation.lock
          bandit -r . -x ./tests -s B101,B105
      - name: Cargo audit
        working-directory: runtime-daemon
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .

  docker:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [test, service-builds, security]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        service: [console, control, gateway, runtime-daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build compose image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          platforms: ${{ matrix.platform }}
          tags: omertaos-${{ matrix.service }}:${{ github.sha }}

  sbom:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
