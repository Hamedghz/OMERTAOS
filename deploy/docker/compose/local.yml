services:
  vault:
    image: hashicorp/vault:1.16
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-${AION_VAULT_TOKEN:-dev-root-token}}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    profiles: ["vault"]
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-format=json"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - vault-data:/vault/data
    networks:
      - aion-local

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aion
      POSTGRES_PASSWORD: aion
      POSTGRES_DB: aion
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aion -d aion || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - aion-local

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - aion-local

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - aion-local

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - aion-local

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - aion-local

  proxy-router:
    image: teddysun/xray:latest
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./deploy/proxy/xray/config.json:/etc/xray/config.json:ro
    ports: []
    networks:
      - aion-local

  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    environment:
      AION_DOCKER: "1"
      AION_CONTROL_DISABLE_SECRETS: "1"
      AION_CONTROL_LOCAL_SECRET_KEY: ${OMERTA_CONTROL_LOCAL_SECRET_KEY:-${AION_CONTROL_LOCAL_SECRET_KEY:-}}
      AION_CONTROL_POSTGRES_DSN: postgresql://aion:aion@postgres:5432/aion
      AION_CONTROL_MONGO_DSN: mongodb://mongo:27017/aion
      AION_CONTROL_REDIS_URL: redis://redis:6379/0
      AION_CONTROL_QDRANT_URL: http://qdrant:6333
      AION_CONTROL_MINIO_ENDPOINT: minio:9000
      AION_CONTROL_MINIO_ACCESS_KEY: minio
      AION_CONTROL_MINIO_SECRET_KEY: miniosecret
      AION_CONTROL_MINIO_BUCKET: aion-raw
      AION_CONTROL_MINIO_SECURE: "false"
      AION_CONTROL_MODELS_DIRECTORY: /app/registry/models
      AION_CONTROL_POLICIES_DIRECTORY: /app/policies
      TENANCY_MODE: single
      AION_ENV: ${OMERTA_ENV:-${AION_ENV:-dev}}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,control,gateway,console,redis,postgres,mongo,qdrant,minio}
    volumes:
      - ./policies:/app/policies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      mongo:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - aion-local

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      AION_GATEWAY_PORT: 8080
      AION_GATEWAY_HOST: 0.0.0.0
      AION_CONTROL_GRPC: control:50051
      AION_CONTROL_BASE_URL: http://control:8000
      AION_CONTROL_API_PREFIX: /v1
      AION_REDIS_URL: redis://redis:6379/0
      AION_GATEWAY_ADMIN_TOKEN: ${OMERTA_GATEWAY_ADMIN_TOKEN:-${AION_GATEWAY_ADMIN_TOKEN:-${AION_ADMIN_TOKEN:-dev-admin-token}}}
      AION_AUTH_MODE: disabled
      SECRET_PROVIDER_MODE: local
      AION_SELF_EVOLVING_ENABLED: "false"
      AION_RATE_LIMIT_MAX: "1000"
      AION_RATE_LIMIT_PER_IP: "true"
      AION_RATE_LIMIT_WINDOW: "60"
      AION_IDEMPOTENCY_TTL: "600"
      AION_TLS_REQUIRE_MTLS: "false"
      AION_TLS_REQUIRED: "false"
      AION_DEV_KERNEL_ENABLED: "false"
      AION_ENV: ${OMERTA_ENV:-${AION_ENV:-dev}}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,control,gateway,console,redis,postgres,mongo,qdrant,minio}
    depends_on:
      control:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./schemas/v1/protos:/protos:ro
    networks:
      - aion-local
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    environment:
      AION_DOCKER: "1"
      DOCKER: "true"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: development-secret
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
      GATEWAY_URL: http://gateway:8080
      AION_GATEWAY_URL: http://gateway:8080
      DATABASE_URL: postgresql://aion:aion@postgres:5432/aion?schema=public
      SECRET_PROVIDER_MODE: local
      AION_DEV_ADMIN_TOKEN: ${OMERTA_DEV_ADMIN_TOKEN:-${AION_DEV_ADMIN_TOKEN:-dev-admin-token}}
      AION_ADMIN_TOKEN: ${OMERTA_GATEWAY_ADMIN_TOKEN:-${AION_ADMIN_TOKEN:-${AION_GATEWAY_ADMIN_TOKEN:-dev-admin-token}}}
      PORT: 3000
      AION_ENV: ${OMERTA_ENV:-${AION_ENV:-dev}}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,control,gateway,console,redis,postgres,mongo,qdrant,minio}
    depends_on:
      gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - aion-local
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mongo-data:
  minio-data:
  qdrant-data:
  vault-data:

networks:
  aion-local:
    driver: bridge
    internal: false
