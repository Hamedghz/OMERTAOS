services:
  vault:
    profiles: ["vault"]
    image: hashicorp/vault:1.17
    container_name: aion-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-aion-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: >-
      server -dev
      -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID:-aion-dev-root}
      -dev-listen-address=0.0.0.0:8200
    ports: []
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          status=$$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8200/v1/sys/health || echo 0);
          if [ "$$status" -eq 200 ] || [ "$$status" -eq 204 ] || [ "$$status" -eq 429 ] || [ "$$status" -eq 472 ] || [ "$$status" -eq 473 ]; then
            exit 0;
          fi;
          echo "Vault health status: $$status";
          exit 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [aion]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${OMERTA_DB_USER:-${AION_DB_USER:-aion}}
      POSTGRES_PASSWORD: ${OMERTA_DB_PASSWORD:-${AION_DB_PASSWORD:-password}}
      POSTGRES_DB: ${OMERTA_DB_NAME:-${AION_DB_NAME:-omerta_db}}
    ports: []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OMERTA_DB_USER:-${AION_DB_USER:-aion}} -d ${OMERTA_DB_NAME:-${AION_DB_NAME:-omerta_db}} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [aion]

  redis:
    image: redis:7
    ports: []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [aion]

  qdrant:
    image: qdrant/qdrant:latest
    ports: []
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          status=$$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6333/readyz || echo 0);
          if [ "$$status" -eq 200 ] || [ "$$status" -eq 204 ]; then
            exit 0;
          fi;
          echo "Qdrant readiness status: $$status";
          exit 1
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks: [aion]

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-miniosecret}
    command: server /data --console-address ":9001"
    ports: []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [aion]
    volumes:
      - minio-data:/data

  proxy-router:
    image: teddysun/xray:latest
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./deploy/proxy/xray/config.json:/etc/xray/config.json:ro
    ports: []
    networks: [aion]

  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    environment:
      OMERTA_CONTROL_DISABLE_SECRETS: ${OMERTA_CONTROL_DISABLE_SECRETS:-${AION_CONTROL_DISABLE_SECRETS:-1}}
      OMERTA_CONTROL_LOCAL_SECRET_KEY: ${OMERTA_CONTROL_LOCAL_SECRET_KEY:-${AION_CONTROL_LOCAL_SECRET_KEY:-}}
      OMERTA_CONTROL_API_PREFIX: ${OMERTA_CONTROL_API_PREFIX:-${AION_CONTROL_API_PREFIX:-/api}}
      OMERTA_CONTROL_REDIS_URL: ${OMERTA_CONTROL_REDIS_URL:-${AION_CONTROL_REDIS_URL:-redis://redis:6379/0}}
      OMERTA_CONTROL_POSTGRES_DSN: ${OMERTA_CONTROL_POSTGRES_DSN:-${AION_CONTROL_POSTGRES_DSN:-postgresql://aion:password@postgres:5432/omerta_db}}
      OMERTA_CONTROL_MONGO_DSN: ${OMERTA_CONTROL_MONGO_DSN:-${AION_CONTROL_MONGO_DSN:-mongodb://mongo:27017/aion?retryWrites=true&w=majority}}
      OMERTA_CONTROL_QDRANT_URL: ${OMERTA_CONTROL_QDRANT_URL:-${AION_CONTROL_QDRANT_URL:-http://qdrant:6333}}
      OMERTA_CONTROL_MODELS_DIRECTORY: ${OMERTA_CONTROL_MODELS_DIRECTORY:-${AION_CONTROL_MODELS_DIRECTORY:-/app/registry/models}}
      OMERTA_CONTROL_POLICIES_DIRECTORY: ${OMERTA_CONTROL_POLICIES_DIRECTORY:-${AION_CONTROL_POLICIES_DIRECTORY:-/srv/app/policies}}
      OMERTA_GATEWAY_ADMIN_TOKEN: ${OMERTA_GATEWAY_ADMIN_TOKEN:-${AION_GATEWAY_ADMIN_TOKEN:-${AION_ADMIN_TOKEN:-dev-admin-token}}}
      TENANCY_MODE: ${TENANCY_MODE:-single}
      OMERTA_DB_SECRET_PATH: ${OMERTA_DB_SECRET_PATH:-${AION_DB_SECRET_PATH:-}}
      OMERTA_MINIO_SECRET_PATH: ${OMERTA_MINIO_SECRET_PATH:-${AION_MINIO_SECRET_PATH:-}}
      VAULT_ADDR: ${VAULT_ADDR:-${AION_VAULT_ADDR:-http://vault:8200}}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-${AION_VAULT_KV_MOUNT:-secret}}
      VAULT_TOKEN: ${VAULT_TOKEN:-${AION_VAULT_TOKEN:-}}
      OMERTA_ENV: ${OMERTA_ENV:-${AION_ENV:-dev}}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,control,gateway,console,redis,postgres,qdrant,minio,vault}
      PYTHONPATH: /srv/app
    volumes:
      - ./policies:${OMERTA_CONTROL_POLICIES_DIRECTORY:-${AION_CONTROL_POLICIES_DIRECTORY:-/srv/app/policies}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 60
    command: ["python", "-m", "control.app.serve"]
    networks: [aion]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      OMERTA_GATEWAY_PORT: ${OMERTA_GATEWAY_PORT:-${AION_GATEWAY_PORT:-8080}}
      OMERTA_GATEWAY_HOST: ${OMERTA_GATEWAY_HOST:-${AION_GATEWAY_HOST:-0.0.0.0}}
      OMERTA_CONTROL_GRPC: ${OMERTA_CONTROL_GRPC:-${AION_CONTROL_GRPC:-control:50051}}
      OMERTA_CONTROL_BASE_URL: ${OMERTA_CONTROL_BASE_URL:-${AION_CONTROL_BASE_URL:-http://control:8000}}
      OMERTA_REDIS_URL: ${OMERTA_REDIS_URL:-${AION_REDIS_URL:-redis://redis:6379/0}}
      OMERTA_RATE_LIMIT_MAX: ${OMERTA_RATE_LIMIT_MAX:-${AION_RATE_LIMIT_MAX:-1000}}
      OMERTA_RATE_LIMIT_PER_IP: ${OMERTA_RATE_LIMIT_PER_IP:-${AION_RATE_LIMIT_PER_IP:-30}}
      OMERTA_RATE_LIMIT_WINDOW: ${OMERTA_RATE_LIMIT_WINDOW:-${AION_RATE_LIMIT_WINDOW:-60}}
      OMERTA_IDEMPOTENCY_TTL: ${OMERTA_IDEMPOTENCY_TTL:-${AION_IDEMPOTENCY_TTL:-900}}
      OMERTA_TLS_REQUIRE_MTLS: ${OMERTA_TLS_REQUIRE_MTLS:-${AION_TLS_REQUIRE_MTLS:-false}}
      OMERTA_TLS_REQUIRED: ${OMERTA_TLS_REQUIRED:-${AION_TLS_REQUIRED:-false}}
      OMERTA_JWT_SECRET_PATH: ${OMERTA_JWT_SECRET_PATH:-${AION_JWT_SECRET_PATH:-}}
      OMERTA_GATEWAY_API_KEYS: ${OMERTA_GATEWAY_API_KEYS:-${AION_GATEWAY_API_KEYS:-}}
      OMERTA_GATEWAY_API_KEYS_SECRET_PATH: ${OMERTA_GATEWAY_API_KEYS_SECRET_PATH:-${AION_GATEWAY_API_KEYS_SECRET_PATH:-}}
      OMERTA_GATEWAY_ADMIN_TOKEN: ${OMERTA_GATEWAY_ADMIN_TOKEN:-${AION_GATEWAY_ADMIN_TOKEN:-${AION_ADMIN_TOKEN:-dev-admin-token}}}
      OMERTA_GATEWAY_ADMIN_TOKEN_SECRET_PATH: ${OMERTA_GATEWAY_ADMIN_TOKEN_SECRET_PATH:-${AION_GATEWAY_ADMIN_TOKEN_SECRET_PATH:-${AION_ADMIN_TOKEN_SECRET_PATH:-}}}
      VAULT_ADDR: ${VAULT_ADDR:-${AION_VAULT_ADDR:-http://vault:8200}}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-${AION_VAULT_KV_MOUNT:-secret}}
      VAULT_TOKEN: ${VAULT_TOKEN:-${AION_VAULT_TOKEN:-}}
      OMERTA_GATEWAY_PROFILE: ${OMERTA_GATEWAY_PROFILE:-${AION_PROFILE:-user}}
      OMERTA_ENV: ${OMERTA_ENV:-${AION_ENV:-dev}}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,control,gateway,console,redis,postgres,qdrant,minio,vault}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control:
        condition: service_started
    ports:
      - "8080:${OMERTA_GATEWAY_PORT:-${AION_GATEWAY_PORT:-8080}}"
    volumes:
      - ./schemas/v1/protos:/protos:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.OMERTA_GATEWAY_PORT || '3000'; fetch('http://127.0.0.1:' + port + '/healthz',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [aion]

  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://gateway:8080}
      PORT: ${CONSOLE_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://aion:password@postgres:5432/omerta_db?schema=public}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      OMERTA_GATEWAY_URL: ${OMERTA_GATEWAY_URL:-${AION_GATEWAY_URL:-http://gateway:8080}}
      OMERTA_GATEWAY_ADMIN_TOKEN: ${OMERTA_GATEWAY_ADMIN_TOKEN:-${AION_GATEWAY_ADMIN_TOKEN:-${AION_ADMIN_TOKEN:-dev-admin-token}}}
      OMERTA_GATEWAY_ADMIN_TOKEN_SECRET_PATH: ${OMERTA_GATEWAY_ADMIN_TOKEN_SECRET_PATH:-${AION_ADMIN_TOKEN_SECRET_PATH:-${AION_GATEWAY_ADMIN_TOKEN_SECRET_PATH:-}}}
      OMERTA_ENABLE_PRISMA: ${OMERTA_ENABLE_PRISMA:-${AION_ENABLE_PRISMA:-1}}
      VAULT_ADDR: ${VAULT_ADDR:-${AION_VAULT_ADDR:-http://vault:8200}}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-${AION_VAULT_KV_MOUNT:-secret}}
      VAULT_TOKEN: ${VAULT_TOKEN:-${AION_VAULT_TOKEN:-}}
      OMERTA_ENV: ${OMERTA_ENV:-${AION_ENV:-dev}}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,control,gateway,console,redis,postgres,qdrant,minio,vault}
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "3000:${CONSOLE_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3000}/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [aion]

  dev-kernel:
    build:
      context: .
      dockerfile: app/kernel/Dockerfile
    container_name: aion-dev-kernel
    env_file:
      - .env
    environment:
      OMERTA_ENV: dev
      OMERTA_KERNEL_PROFILE: ${OMERTA_KERNEL_PROFILE:-${AION_KERNEL_PROFILE:-dev-qwen-coder}}
      ORCH_PROVIDER: ${ORCH_PROVIDER:-}
      ORCH_MODEL: ${ORCH_MODEL:-}
      ORCH_ENDPOINT: ${ORCH_ENDPOINT:-}
      ORCH_API_KEY: ${ORCH_API_KEY:-}
      CODER_PROVIDER: ${CODER_PROVIDER:-}
      CODER_MODEL: ${CODER_MODEL:-}
      CODER_ENDPOINT: ${CODER_ENDPOINT:-}
      CODER_API_KEY: ${CODER_API_KEY:-}
      VAULT_ADDR: ${VAULT_ADDR:-${AION_VAULT_ADDR:-http://vault:8200}}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-${AION_VAULT_KV_MOUNT:-secret}}
      VAULT_TOKEN: ${VAULT_TOKEN:-${AION_VAULT_TOKEN:-}}
    volumes:
      - ./app:/app/app
      - ./config:/app/config
    ports: []
    depends_on:
      - llm-gateway
      - vault
    profiles: ["dev-kernel"]
    networks: [aion]

  llm-gateway:
    image: your-llm-gateway:latest
    container_name: aion-llm-gateway
    environment:
      DUMMY: "1"
    ports: []
    profiles: ["dev-kernel"]
    networks: [aion]

volumes:
  minio-data: {}
  qdrant-data: {}
  vault-data: {}

networks:
  aion:
    driver: bridge
    internal: true
